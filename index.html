  <style>
    :root {
      --bg-main: #121317;
      --bg-card: #212226;
      --bg-sidebar: #18191D;
      --bg-surface: #18191D;
      --bg-elevated: #2F3034;
      --text-primary: #FFFFFF;
      --text-body: #E6EAF0;
      --text-secondary: #B2BBC5;
      --text-muted: #45474D;
      --border-main: rgba(230, 234, 240, 0.12);
      --border-subtle: rgba(230, 234, 240, 0.06);
      --accent-blue: #3279F9;
      --accent-blue-hover: #4A8FFF;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 36px;
    }

    body {
      font-family: 'Google Sans Flex', 'Google Sans', 'Segoe UI', sans-serif;
      font-weight: 400;
      font-optical-sizing: auto;
      background-color: var(--bg-main);
      color: var(--text-body);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      margin: 0;
      padding: 0;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;

      /* Mobile UX Optimizations */
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Allow selection in inputs */
    input,
    textarea {
      user-select: auto;
      -webkit-user-select: auto;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-weight: 450;
      font-optical-sizing: auto;
      color: var(--text-primary);
    }

    h1 {
      font-size: 42px;
      line-height: 44px;
      letter-spacing: -0.73px;
    }

    h2 {
      font-size: 32px;
      line-height: 34px;
      letter-spacing: -0.15px;
    }

    h3 {
      font-size: 24px;
      line-height: 26px;
      letter-spacing: -0.07px;
    }

    h4 {
      font-size: 20px;
      line-height: 26px;
      letter-spacing: -0.05px;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 28px;
        line-height: 30px;
      }

      h2 {
        font-size: 24px;
        line-height: 26px;
      }

      h3 {
        font-size: 20px;
        line-height: 22px;
      }

      h4 {
        font-size: 18px;
        line-height: 23px;
      }
    }

    #root {
      width: 100%;
      height: 100vh;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--text-muted);
      border-radius: 10px;
    }

    /* Safe area support */
    .safe-top {
      padding-top: env(safe-area-inset-top);
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    .safe-left {
      padding-left: env(safe-area-inset-left);
    }

    .safe-right {
      padding-right: env(safe-area-inset-right);
    }
  </style>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        // Unregister ALL old service workers (including old proxy SW)
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const reg of registrations) {
          await reg.unregister();
          console.log('Service Worker unregistered:', reg.scope);
        }
        // Re-register clean SW
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('SW registration failed: ', err);
        });
      });
    }
  </script>
